name: Author pending readings

# Triggers whenever something lands on main. The /api/add-entity serverless
# function writes pending-readings/<name>.flag when a visitor opts in to
# auto-readings AND is within the 1-per-IP-per-day cap. This workflow scans
# for those flags and authors readings via the Anthropic API, then commits +
# pushes the result. The push triggers Vercel to rebuild with the new readings.

on:
  push:
    branches: [main]
    paths:
      - 'pending-readings/**'      # only run when a marker is added/changed
      - '.github/workflows/author-pending-readings.yml'

  # Allow manual triggering from the Actions tab for one-off runs
  workflow_dispatch: {}

permissions:
  contents: write   # the workflow needs to commit + push readings back

# Avoid running this workflow on its OWN commits (which would loop forever).
# The check: skip if the latest commit author is the bot itself.
concurrency:
  group: author-pending-readings
  cancel-in-progress: false

jobs:
  author:
    runs-on: ubuntu-latest

    steps:
      - name: Skip if this push was from the bot (avoid infinite loop)
        id: gate
        run: |
          AUTHOR="${{ github.event.head_commit.author.name }}"
          echo "commit author: $AUTHOR"
          if [ "$AUTHOR" = "github-actions[bot]" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout
        if: steps.gate.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install minimal deps (readings authoring doesn't need pyswisseph)
        if: steps.gate.outputs.skip != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install PyYAML>=6.0

      - name: Author pending readings
        if: steps.gate.outputs.skip != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OMNI_MODEL_AUTHORING: ${{ vars.OMNI_MODEL_AUTHORING || 'claude-sonnet-4-6' }}
        run: |
          python3 tools/profile-author/author_pending.py

      - name: Commit + push
        if: steps.gate.outputs.skip != 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain)" ]; then
            echo "no changes to commit (no markers were pending, or all already had readings)"
            exit 0
          fi
          git add vault/04_CANON/People/*.profile.reading.md \
                  vault/04_CANON/People/*.profile.system_readings.md \
                  pending-readings/ 2>/dev/null || true
          git commit -m "Auto-author readings for newly-submitted entities

Triggered by pending-readings markers. The Vercel-rebuild this commit
triggers will publish the readings to the live site."
          git push
